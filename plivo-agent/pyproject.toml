[project]
name = "plivo-agent"
version = "0.1.0"
description = "A working Plivo phone agent on Pipecat: bring your own speech, language and voice models."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Plivo" }]
keywords = ["plivo", "pipecat", "voice", "phone", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Telephony",
]
dependencies = [
    "pipecat-ai[websocket,silero,local-smart-turn-v3]>=1.16,<2",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/plivo/AI-Voice-Agents/tree/main/plivo-agent"
Documentation = "https://github.com/plivo/AI-Voice-Agents/blob/main/plivo-agent/docs/deploy.md"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
